name: Google Play Internal Release
on:
  workflow_dispatch:
jobs:
  internal:
    environment: google-play-internal
    runs-on: [self-hosted, Windows, unity-6000.3, android]
    steps:
      - uses: actions/checkout@v4
      - name: Materialize signing keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) { throw 'ANDROID_KEYSTORE_BASE64 is required.' }
          $path = Join-Path $env:RUNNER_TEMP 'project-merge-upload.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "MERGEGAME_ANDROID_KEYSTORE_PATH=$path" | Out-File $env:GITHUB_ENV -Append
      - name: Build signed AAB
        shell: pwsh
        env:
          MERGEGAME_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MERGEGAME_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MERGEGAME_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: '& "${{ vars.UNITY_EDITOR_PATH }}" -batchmode -nographics -quit -projectPath "$PWD" -executeMethod MergeGame.Client.Editor.ClientBuild.BuildAndroidStoreRelease -logFile Logs/StoreBuild.log'
      - name: Upload to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.happynewpuzzle.projectmerge
          releaseFiles: Builds/Android/ProjectMerge.aab
          track: internal
          status: draft
      - name: Remove materialized keystore
        if: always()
        shell: pwsh
        run: if ($env:MERGEGAME_ANDROID_KEYSTORE_PATH) { Remove-Item -LiteralPath $env:MERGEGAME_ANDROID_KEYSTORE_PATH -Force -ErrorAction SilentlyContinue }
